# Builds the site with Eleventy and deploys it to GitHub Pages.
# Requires: repo Settings → Pages → Source = "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  # Daily rebuild so date-based content updates on its own
  # (e.g. the Chipotle fundraiser disappears on Nov 9). 08:15 UTC = 12:15 AM PST.
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx @11ty/eleventy
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
